[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fd-training-ocr"
version = "0.1.0"
description = "Local-first structured extraction for standardized fire department training forms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Songg45" }]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.2",
]

[project.scripts]
fd-training-ocr = "fd_training_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
